name: Desktop release

# Builds the Tauri desktop app for Windows, macOS and Linux, then attaches
# the installers to a DRAFT GitHub release on rainman456/breakscale-desktop.
# The Windows build produces the NSIS .exe only (--bundles nsis, no MSI),
# matching the artifact set we ship; macOS ships a universal DMG and Linux
# ships deb + rpm + AppImage. CI (ci.yml) only runs the svelte-check gate,
# so a plain PR never waits on -- or pays for -- a native build.
#
# RELEASE FLOW (same shape as drawdb's build.yml): the workflow is meant to
# run in the FORK (foxyan-ru/breakscale-desktop) -- push the tag there --
# and the release step authenticates with the RAINMAN_TOKEN secret (a
# rainman456 PAT with `repo` scope, pasted into the fork's Actions secrets)
# because the fork's own GITHUB_TOKEN cannot publish to the parent
# repository. Push the same tag to rainman456/breakscale-desktop as well so
# the draft release is created against the right commit. Left unset, the
# release step fails loudly (fail_on_unmatched_files and a bad token both
# surface as step errors) rather than publishing somewhere unintended.
#
# PINNING NOTE: ci.yml pins every action to a commit SHA (see its own
# comments) for supply-chain hardening; this file does the same. The SHAs
# below were resolved with `git ls-remote` and annotated with the tag they
# correspond to. Refresh the pins the same way when bumping (the
# dtolnay/rust-toolchain pin tracks its `stable` branch head, so it goes
# stale on purpose -- re-run ls-remote for refs/heads/stable when touching
# this file).
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      draft:
        description: "Create the GitHub release as a draft"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # a release build should never be cancelled mid-way

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows
            # NSIS only -- the .exe is the installer we ship; skip the MSI
            # rather than building two Windows packages.
            args: "--bundles nsis"
            bundles:
              - src-tauri/target/release/bundle/nsis/*.exe
          - platform: macos-latest
            name: macos-universal
            # Universal binary: both Apple Silicon and Intel in one bundle.
            args: "--target universal-apple-darwin"
            bundles:
              - src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - platform: ubuntu-latest
            name: linux
            args: ""
            bundles:
              - src-tauri/target/release/bundle/deb/*.deb
              - src-tauri/target/release/bundle/rpm/*.rpm
              - src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Linux Tauri builds need the system WebKitGTK/AppIndicator dev
      # packages; Windows and macOS use the OS-provided webview and need
      # nothing extra here.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Icon assets referenced by tauri.conf.json's bundle.icon array are
      # checked in (generated once from static/favicon.svg -- see
      # src-tauri/icons/README.md), so bundling has what it needs; re-run
      # `bun x @tauri-apps/cli icon <source>` after any rebrand.
      - name: Build Tauri app
        env:
          # Populate these repository secrets to code-sign/notarize the
          # macOS and Windows builds -- see README "Signing, packaging and
          # distribution". Left unset, the build still produces unsigned
          # artifacts (fine for local testing, not for public distribution).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bunx tauri build ${{ matrix.args }}

      - name: Upload installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: breakscale-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

  # Only tag builds publish; workflow_dispatch stops after the artifacts so
  # a manual run can smoke-test the native build without touching a release.
  release:
    name: Draft GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Download installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: installers
          merge-multiple: true

      # RAINMAN_TOKEN must be a rainman456 PAT with `repo` scope -- stored
      # as a secret in the fork this workflow runs in -- otherwise the
      # token has no write access to rainman456/breakscale-desktop.
      - name: Draft GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          token: ${{ secrets.RAINMAN_TOKEN }}
          repository: rainman456/breakscale-desktop
          draft: ${{ inputs.draft != false }}
          name: "Breakscale desktop ${{ github.ref_name }}"
          body: 'See the assets below to download and install Breakscale desktop.'
          files: installers/**/*
          fail_on_unmatched_files: true
