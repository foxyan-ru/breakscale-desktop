name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository, so start from zero and grant per job.
permissions: {}

# A new push to a PR makes the previous run irrelevant, so stop it rather than
# paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # svelte-check typechecks the .svelte markup that a plain tsc run never
  # sees -- but it does not run the real Svelte compiler, which is stricter:
  # the first release build failed on `return $state(...)` placement that
  # svelte-check let through. So the gate is check + build: the build is
  # still frontend-only (no cargo), ~40s, and catches compiler-level
  # errors before a release tag does. One Linux run is the whole coverage:
  # both steps read the same bytes on every OS.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The checkout token is not needed after clone, so do not leave it in
          # .git/config where a later step or dependency could read it.
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Build
        run: bun run build
